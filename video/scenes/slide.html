<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="fonts/geist.css"/>
<style>
  html,body{margin:0;width:1920px;height:1080px;background:#0b0b0d;color:#f5f5f4;
            font-family:"Geist",system-ui,sans-serif;overflow:hidden}
  .k{position:absolute;top:64px;left:80px;font-size:22px;letter-spacing:.18em;text-transform:uppercase;color:#55555c;font-weight:600}
  h2{position:absolute;top:104px;left:80px;right:80px;margin:0;font-size:60px;letter-spacing:-.025em;font-weight:600;line-height:1.08}
  h2 em{font-style:normal;color:#b4a7ff}
  .shot{position:absolute;top:230px;left:80px;right:80px;bottom:150px;border:1px solid #26262b;border-radius:18px;
        background-position:center top;background-size:cover;background-repeat:no-repeat}
  .shot.contain{background-size:contain;background-repeat:no-repeat;background-position:center;border:0}
  .cap{position:absolute;left:80px;right:80px;bottom:72px;font-size:27px;color:#a1a1aa;line-height:1.35}
  .cap b{color:#f5f5f4;font-weight:600}
  .cap i{font-style:normal;color:#6ee7a0}
</style></head>
<body>
  <div class="k" id="k"></div><h2 id="h"></h2>
  <div class="shot" id="s"></div><div class="cap" id="c"></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('k').textContent = q.get('k') || '';
  document.getElementById('h').innerHTML = q.get('h') || '';
  document.getElementById('c').innerHTML = q.get('c') || '';
  const s = document.getElementById('s');
  s.style.backgroundImage = `url("${q.get('img')}")`;
  if (q.get('fit') === 'contain') s.classList.add('contain');
</script>
</body></html>
