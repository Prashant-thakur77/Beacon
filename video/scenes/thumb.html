<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="fonts/geist.css"/>
<style>
  html,body{margin:0;width:1280px;height:720px;background:#0b0b0d;font-family:"Geist",system-ui,sans-serif;overflow:hidden}
  .shot{position:absolute;inset:0;background:url("thumb-base.jpg") center/cover no-repeat;filter:saturate(.92)}
  .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,13,.72) 0 12%,rgba(11,11,13,.18) 34%,rgba(11,11,13,.86) 62%,#0b0b0d 88%)}
  .top{position:absolute;top:0;left:0;right:0;height:76px;background:#034f46;display:flex;align-items:center;padding:0 40px;gap:14px}
  .top b{font-size:25px;letter-spacing:.02em;color:#fffdeb;font-weight:600}
  .top span{font-size:21px;color:#9fd8c9;font-family:"Geist Mono",monospace}
  .wrap{position:absolute;left:52px;right:52px;bottom:44px}
  h1{margin:0;font-size:92px;line-height:.98;letter-spacing:-.035em;font-weight:600;color:#f5f5f4}
  h1 em{font-style:normal;color:#b4a7ff}
  .sub{margin-top:22px;font-size:27px;color:#c9c9cf;letter-spacing:-.01em}
  .sub b{color:#6ee7a0;font-weight:600}
  .pill{position:absolute;right:52px;top:110px;background:rgba(255,108,76,.14);border:2px solid #ff6c4c;color:#ff8e74;
        border-radius:999px;padding:12px 24px;font-size:24px;font-weight:600;font-family:"Geist Mono",monospace}
</style></head>
<body>
  <div class="shot"></div><div class="scrim"></div>
  <div class="top"><b>Beacon Night Shift</b><span>· live on AWS</span></div>
  <div class="pill">INTERRUPTED</div>
  <div class="wrap">
    <h1>The on-call agent<br/><em>you can interrupt</em></h1>
    <div class="sub">AssemblyAI Voice Agent API · speak over the read-back and <b>the fix is withdrawn</b></div>
  </div>
</body></html>
