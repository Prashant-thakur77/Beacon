<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="fonts/geist.css"/>
<style>
  /* The console's own light palette. The first cut of this thumbnail put a dark
     scrim over the screenshot, which buried the one thing worth showing: the
     product is a cream-and-ink console and the shot of it is already bright. */
  :root{--bg:#FFFFEB;--fg:#1A1A1A;--dim:#5b5b57;--faint:#8a8a84;--line:#e2e2cf;
        --green:#03796A;--lilac:#6B4FD8;--coral:#ff6c4c}
  html,body{margin:0;width:1280px;height:720px;background:var(--bg);color:var(--fg);
            font-family:"Geist",system-ui,sans-serif;overflow:hidden}

  .left{position:absolute;left:72px;top:88px;width:600px}
  .eyebrow{font-family:"Geist Mono",ui-monospace,monospace;font-size:17px;letter-spacing:.14em;
           text-transform:uppercase;color:var(--faint);font-weight:600}
  h1{margin:26px 0 0;font-family:"Liberation Serif","Noto Serif",Georgia,serif;
     font-size:86px;line-height:1.02;letter-spacing:-.02em;font-weight:400}
  h1 em{font-style:italic;color:var(--green)}
  .sub{margin-top:30px;font-size:26px;line-height:1.35;color:var(--dim);letter-spacing:-.01em;max-width:520px}
  .pill{display:inline-block;margin-top:22px;background:rgba(3,121,106,.10);border:2px solid var(--green);
        color:var(--green);border-radius:10px;padding:9px 18px;font-size:23px;font-weight:600}

  .brand{position:absolute;left:72px;bottom:54px;display:flex;align-items:center;gap:12px;
         font-size:31px;letter-spacing:-.01em}
  .brand .dot{width:13px;height:13px;border-radius:50%;background:var(--coral)}
  .brand b{font-weight:700}
  .brand span{color:var(--faint);font-family:"Liberation Serif","Noto Serif",Georgia,serif;font-size:34px}

  /* The screenshot leans in from the right, cropped by the frame rather than
     shrunk to fit — a readable corner of the real console beats a whole
     illegible one. */
  .shot{position:absolute;right:-150px;top:96px;width:820px;height:540px;border-radius:16px;
        border:1px solid var(--line);background:url("thumb-base.jpg") -690px -70px/1560px auto no-repeat;
        transform:perspective(1500px) rotateY(-15deg) rotate(-1.6deg);
        box-shadow:0 44px 90px rgba(26,26,26,.20),0 8px 22px rgba(26,26,26,.10)}
  .tag{position:absolute;right:150px;top:322px;background:var(--bg);border:2px solid var(--coral);color:#c73c1d;
       border-radius:999px;padding:9px 20px;font-family:"Geist Mono",ui-monospace,monospace;
       font-size:20px;font-weight:600;letter-spacing:.04em;
       box-shadow:0 10px 26px rgba(26,26,26,.14)}
</style></head>
<body>
  <div class="shot"></div>
  <div class="tag">INTERRUPTED</div>
  <div class="left">
    <div class="eyebrow">AssemblyAI Voice Agent hackathon 2026</div>
    <h1>It&rsquo;s 3 AM.<br/><em>Approve fix one.</em></h1>
    <div class="sub">The on-call agent you can interrupt &mdash; and the only thing that unlocks a change is a sentence AssemblyAI heard you say.</div>
    <div class="pill">AssemblyAI Voice Agent API</div>
  </div>
  <div class="brand"><span class="dot"></span><b>Beacon</b><span>Night Shift</span></div>
</body></html>
