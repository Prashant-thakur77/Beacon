name: Build and Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/beacon

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # cordon pulls full CUDA torch by default; install CPU torch first, then cordon without deps
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install --no-deps cordon
      - run: pip install -e ".[agent,dev]"
      - run: ruff check src/ tests/ scripts/
      - run: ruff format --check src/ tests/ scripts/
      - run: mypy src/beacon/
      - run: cfn-lint template.yaml remediation-template.yaml console-template.yaml demo/demo-infra-template.yaml --ignore-checks W1011
      - run: pytest -q -p no:warnings

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  publish-ghcr:
    needs: [test, console]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          docker build -t "$GHCR_IMAGE:$TAG" .
          docker tag "$GHCR_IMAGE:$TAG" "$GHCR_IMAGE:latest"
          docker push "$GHCR_IMAGE:$TAG"
          docker push "$GHCR_IMAGE:latest"
