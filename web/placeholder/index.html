<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beacon Night Shift</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B1020; color: #E6E9F2; font: 16px/1.5 system-ui, sans-serif; }
  main { text-align: center; padding: 24px; }
  h1 { font-weight: 600; letter-spacing: .02em; margin: 0 0 8px; }
  p { color: #8B93A7; margin: 0; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #FFB020; margin-right: 8px; box-shadow: 0 0 12px #FFB020; }
</style>
</head>
<body>
<main>
  <h1><span class="dot"></span>Beacon Night Shift</h1>
  <p>Console stack is up. The Night Board is being deployed.</p>
</main>
</body>
</html>
