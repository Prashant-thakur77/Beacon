AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Beacon console stack: the Night Board web app on S3 + CloudFront, the
  voice-turn Lambda (Strands agent on Nova 2 Lite, Transcribe creds vend,
  Polly) and the read-only dashboard API, both behind Lambda Function URLs.

Parameters:
  BaseStackName:
    Type: String
    Default: beacon

  AgentImageUri:
    Type: String
    Description: ECR URI of the slim agent image (Dockerfile.agent, git-SHA tag)

  LambdaArchitecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]

  RemediateFunctionArn:
    Type: String
    Description: ARN of beacon-remediate-<stack> (remediation stack output); the voice Lambda may invoke it for dry-runs

  Passcode:
    Type: String
    NoEcho: true
    MinLength: 4
    Description: Shared passcode required on /session and /turn (stops strangers burning credits)

  RemediableEcsServices:
    Type: String
    Default: ""
    Description: cluster/service pairs Beacon may force-redeploy (same value as the base stack)

  ApplyEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Kill switch for approve_fix / grant_sleep_contract in the voice Lambda

  NovaModelId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0

  BedrockRegion:
    Type: String
    Default: us-east-1

  PollyVoiceId:
    Type: String
    Default: Kajal
    Description: Polly voice for Beacon's replies (Kajal = en-IN neural; fallback Joanna)

  SttLanguage:
    Type: String
    Default: en-IN
    Description: Transcribe streaming language code used by the browser

  SnsTopicArn:
    Type: String
    Default: ""
    Description: Base-stack SNS topic for Lambda error alarms (blank = no alarms)

  VoiceEngine:
    Type: String
    Default: strands
    AllowedValues: [strands, litellm]
    Description: strands = Strands Agents SDK loop; litellm = fallback tool-calling loop with the same schemas

  ReservedConcurrency:
    Type: Number
    Default: 0
    Description: >
      Reserved concurrency for the voice-turn and dashboard Lambdas (0 = none). New
      accounts have a 10-execution unreserved minimum that makes any reservation fail.

  UseCloudFront:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      false = serve the console from S3 website hosting (HTTP) instead of CloudFront. Only for
      accounts still under AWS's new-account verification, which blocks CloudFront creation;
      the mic needs HTTPS, typed input works either way. Redeploy with true once verified.

Conditions:
  PageOnErrors: !Not [!Equals [!Ref SnsTopicArn, ""]]
  UseCloudFront: !Equals [!Ref UseCloudFront, "true"]
  UseS3Website: !Not [!Equals [!Ref UseCloudFront, "true"]]
  ReserveConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]

Resources:

  # ---------- Static site ----------

  BeaconConsoleBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "beacon-console-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: !If [UseCloudFront, true, false]
        IgnorePublicAcls: true
        RestrictPublicBuckets: !If [UseCloudFront, true, false]
      WebsiteConfiguration: !If
        - UseS3Website
        - IndexDocument: index.html
          ErrorDocument: index.html
        - !Ref AWS::NoValue

  BeaconConsoleOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: UseCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "beacon-console-${BaseStackName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  BeaconConsoleHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Condition: UseCloudFront
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "beacon-console-${BaseStackName}"
        Comment: HSTS, nosniff, no framing, and a CSP that names every origin the console talks to
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            Override: true
            # connect-src: the two Function URLs, Transcribe streaming (mic), AssemblyAI (phase 2).
            # media-src data:  Polly audio arrives base64 in the turn response.
            # style-src 'unsafe-inline': React inline style attributes; scripts stay strict.
            ContentSecurityPolicy: !Sub >-
              default-src 'self';
              script-src 'self';
              style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
              font-src 'self' https://fonts.gstatic.com;
              img-src 'self' data:;
              media-src 'self' blob: data:;
              worker-src 'self' blob:;
              connect-src 'self' https://*.lambda-url.${AWS::Region}.on.aws
              wss://transcribestreaming.${AWS::Region}.amazonaws.com:8443
              wss://agents.assemblyai.com https://api.assemblyai.com;
              frame-ancestors 'none';
              base-uri 'self';
              form-action 'self'
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: microphone=(self), camera=(), geolocation=()
              Override: true

  BeaconConsoleDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Beacon console (${BaseStackName})"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: console-s3
            DomainName: !GetAtt BeaconConsoleBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt BeaconConsoleOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: console-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref BeaconConsoleHeaders
        CacheBehaviors:
          - PathPattern: /config.json
            TargetOriginId: console-s3
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
            ResponseHeadersPolicyId: !Ref BeaconConsoleHeaders
          - PathPattern: /replay/*
            TargetOriginId: console-s3
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
            ResponseHeadersPolicyId: !Ref BeaconConsoleHeaders
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  BeaconConsoleBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: UseCloudFront
    Properties:
      Bucket: !Ref BeaconConsoleBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${BeaconConsoleBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${BeaconConsoleDistribution}"

  BeaconConsoleWebsitePolicy:
    Type: AWS::S3::BucketPolicy
    Condition: UseS3Website
    Properties:
      Bucket: !Ref BeaconConsoleBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadForWebsite
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${BeaconConsoleBucket.Arn}/*"

  # ---------- Voice turn (read-only agent role) ----------

  BeaconVoiceTurnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "beacon-voice-turn-${BaseStackName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BeaconVoiceTurnReads
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - "arn:aws:bedrock:*::foundation-model/amazon.nova-*"
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*amazon.nova-*"
              - Effect: Allow
                Action: polly:SynthesizeSpeech
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/beacon-incidents-${BaseStackName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/beacon-approvals-${BaseStackName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/beacon-contracts-${BaseStackName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/beacon-changes-${BaseStackName}"
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:beacon-remediate-${BaseStackName}"
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:GetMetricData
                  - cloudwatch:DescribeAlarms
                  - logs:FilterLogEvents
                  - logs:DescribeLogGroups
                  - ec2:DescribeSecurityGroups
                  - ecs:DescribeServices
                  - rds:DescribeDBInstances
                  - lambda:GetFunction
                  - cloudtrail:LookupEvents
                Resource: "*"
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/beacon/*"
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  # The browser gets 15-minute credentials for exactly one action. The trust
  # policy admits only the voice role (by ARN condition on the account root
  # principal, which avoids both the circular reference and IAM's "Invalid
  # principal" race on a freshly created role); the AssumeRole grant lives in
  # a separate policy resource.
  BeaconMicRole:
    Type: AWS::IAM::Role
    DependsOn: BeaconVoiceTurnRole
    Properties:
      RoleName: !Sub "beacon-mic-${BaseStackName}"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/beacon-voice-turn-${BaseStackName}"
      Policies:
        - PolicyName: BeaconMicTranscribeOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - transcribe:StartStreamTranscription
                  - transcribe:StartStreamTranscriptionWebSocket
                Resource: "*"

  BeaconVoiceTurnAssumePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "beacon-voice-turn-assume-${BaseStackName}"
      Roles:
        - !Ref BeaconVoiceTurnRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt BeaconMicRole.Arn
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Ref RemediateFunctionArn

  BeaconVoiceTurnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/beacon/${BaseStackName}/voice-turn"
      RetentionInDays: 14

  BeaconVoiceTurnFunction:
    Type: AWS::Lambda::Function
    DependsOn: BeaconVoiceTurnAssumePolicy
    Properties:
      FunctionName: !Sub "beacon-voice-turn-${BaseStackName}"
      PackageType: Image
      Architectures:
        - !Ref LambdaArchitecture
      Code:
        ImageUri: !Ref AgentImageUri
      ImageConfig:
        Command: ["beacon.voice_turn.handler"]
      Role: !GetAtt BeaconVoiceTurnRole.Arn
      MemorySize: 2048
      Timeout: 45
      # Public URL behind a passcode: cap the blast radius of a flood (each turn is a Bedrock call).
      ReservedConcurrentExecutions: !If [ReserveConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref BeaconVoiceTurnLogGroup
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          PASSCODE: !Ref Passcode
          APPLY_ENABLED: !Ref ApplyEnabled
          VOICE_ENGINE: !Ref VoiceEngine
          NOVA_MODEL_ID: !Ref NovaModelId
          BEDROCK_REGION: !Ref BedrockRegion
          POLLY_VOICE_ID: !Ref PollyVoiceId
          STT_LANGUAGE: !Ref SttLanguage
          MIC_ROLE_ARN: !GetAtt BeaconMicRole.Arn
          REMEDIATE_FUNCTION_ARN: !Ref RemediateFunctionArn
          STATE_MACHINE_ARN: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:beacon-remediate-${BaseStackName}"
          INCIDENTS_TABLE_NAME: !Sub "beacon-incidents-${BaseStackName}"
          APPROVALS_TABLE_NAME: !Sub "beacon-approvals-${BaseStackName}"
          CONTRACTS_TABLE_NAME: !Sub "beacon-contracts-${BaseStackName}"
          CHANGES_TABLE_NAME: !Sub "beacon-changes-${BaseStackName}"
          GOLDEN_SG_PARAM: !Sub "/beacon/${BaseStackName}/golden-sg"
          REMEDIABLE_ECS_SERVICES: !Ref RemediableEcsServices
          SESSION_CAP_TURNS: "30"
          POWERTOOLS_SERVICE_NAME: beacon-voice-turn
          BEACON_VERSION: "0.2.0"
          POWERTOOLS_METRICS_NAMESPACE: Beacon
          LITELLM_LOCAL_MODEL_COST_MAP: "True"

  BeaconVoiceTurnUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref BeaconVoiceTurnFunction
      AuthType: NONE
      Cors:
        # Only the console (and a local Vite dev server) may call this from a browser.
        AllowOrigins:
          - !If
            - UseCloudFront
            - !Sub "https://${BeaconConsoleDistribution.DomainName}"
            - !Sub "http://${BeaconConsoleBucket}.s3-website-${AWS::Region}.amazonaws.com"
          - http://localhost:5173
        AllowHeaders: ["content-type", "x-beacon-passcode"]
        AllowMethods: [GET, POST]
        MaxAge: 300

  BeaconVoiceTurnUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BeaconVoiceTurnFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # Since 2025 a public Function URL also needs InvokeFunction scoped to URL invocations.
  BeaconVoiceTurnUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BeaconVoiceTurnFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  BeaconVoiceTurnWarmRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Keep the voice-turn Lambda warm so the first turn is not dead air
      ScheduleExpression: rate(4 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt BeaconVoiceTurnFunction.Arn
          Id: BeaconVoiceTurnWarmTarget
          Input: '{"mode": "warm"}'

  BeaconVoiceTurnWarmPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BeaconVoiceTurnFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BeaconVoiceTurnWarmRule.Arn

  # ---------- Dashboard API (read-only) ----------

  BeaconDashboardRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BeaconDashboardReads
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/beacon-incidents-${BaseStackName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/beacon-approvals-${BaseStackName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/beacon-contracts-${BaseStackName}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/beacon-changes-${BaseStackName}"
              - Effect: Allow
                Action: dynamodb:DeleteItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/beacon-contracts-${BaseStackName}"
              - Effect: Allow
                Action:
                  - states:DescribeExecution
                  - states:GetExecutionHistory
                Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:beacon-remediate-${BaseStackName}:*"
              - Effect: Allow
                Action:
                  - lambda:GetFunctionConfiguration
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:beacon-${BaseStackName}"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:beacon-voice-turn-${BaseStackName}"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:beacon-remediate-${BaseStackName}"
              - Effect: Allow
                Action: cloudwatch:GetMetricStatistics
                Resource: "*"

  BeaconDashboardLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/beacon/${BaseStackName}/dashboard"
      RetentionInDays: 14

  BeaconDashboardFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "beacon-dashboard-${BaseStackName}"
      PackageType: Image
      Architectures:
        - !Ref LambdaArchitecture
      Code:
        ImageUri: !Ref AgentImageUri
      ImageConfig:
        Command: ["beacon.dashboard_api.handler"]
      Role: !GetAtt BeaconDashboardRole.Arn
      MemorySize: 512
      Timeout: 15
      ReservedConcurrentExecutions: !If [ReserveConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref BeaconDashboardLogGroup
      Environment:
        Variables:
          PASSCODE: !Ref Passcode
          BASE_STACK_NAME: !Ref BaseStackName
          INCIDENTS_TABLE_NAME: !Sub "beacon-incidents-${BaseStackName}"
          APPROVALS_TABLE_NAME: !Sub "beacon-approvals-${BaseStackName}"
          CONTRACTS_TABLE_NAME: !Sub "beacon-contracts-${BaseStackName}"
          CHANGES_TABLE_NAME: !Sub "beacon-changes-${BaseStackName}"
          STATE_MACHINE_ARN: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:beacon-remediate-${BaseStackName}"
          POWERTOOLS_SERVICE_NAME: beacon-dashboard
          BEACON_VERSION: "0.2.0"
          LITELLM_LOCAL_MODEL_COST_MAP: "True"

  BeaconDashboardUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref BeaconDashboardFunction
      AuthType: NONE
      Cors:
        AllowOrigins:
          - !If
            - UseCloudFront
            - !Sub "https://${BeaconConsoleDistribution.DomainName}"
            - !Sub "http://${BeaconConsoleBucket}.s3-website-${AWS::Region}.amazonaws.com"
          - http://localhost:5173
        AllowHeaders: ["content-type", "x-beacon-passcode"]
        AllowMethods: [GET, POST, DELETE]
        MaxAge: 300

  BeaconDashboardUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BeaconDashboardFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # Since 2025 a public Function URL also needs InvokeFunction scoped to URL invocations.
  BeaconDashboardUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BeaconDashboardFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ---------- Paging: a broken voice or dashboard function reaches the SNS topic ----------

  BeaconVoiceTurnErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: PageOnErrors
    Properties:
      AlarmName: !Sub "beacon-${BaseStackName}-voice-turn-errors"
      AlarmDescription: The voice-turn Lambda raised; the console will show "reconnecting"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref BeaconVoiceTurnFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SnsTopicArn

  BeaconDashboardErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: PageOnErrors
    Properties:
      AlarmName: !Sub "beacon-${BaseStackName}-dashboard-errors"
      AlarmDescription: The dashboard API Lambda raised
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref BeaconDashboardFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SnsTopicArn

Outputs:
  ConsoleUrl:
    Value: !If
      - UseCloudFront
      - !Sub "https://${BeaconConsoleDistribution.DomainName}"
      - !Sub "http://${BeaconConsoleBucket}.s3-website-${AWS::Region}.amazonaws.com"
  VoiceTurnUrl:
    Value: !GetAtt BeaconVoiceTurnUrl.FunctionUrl
  DashboardUrl:
    Value: !GetAtt BeaconDashboardUrl.FunctionUrl
  BucketName:
    Value: !Ref BeaconConsoleBucket
  DistributionId:
    Value: !If [UseCloudFront, !Ref BeaconConsoleDistribution, "none"]
  VoiceTurnFunctionName:
    Value: !Ref BeaconVoiceTurnFunction
  DashboardFunctionName:
    Value: !Ref BeaconDashboardFunction
  MicRoleArn:
    Value: !GetAtt BeaconMicRole.Arn
