<text x="45" y="665" fill="#8b93a7" font-size="12.5">AWS Step Functions (Standard) · Powertools for AWS Lambda · X-Ray</text>
<text x="45" y="690" fill="#b8a6ff" font-size="13" font-weight="700">Sleep Contract: the same loop starts from the triage Lambda with source=contract — no page, an email in the morning. Scoped to alarm + action + exact resources; counted; expires; your quote as the record.</text>
<text x="45" y="712" fill="#8b93a7" font-size="12">Kill switch: APPLY_ENABLED=false on triage, voice and remediate stops every write path. tests/test_template_safety.py proves the two-role split from the CloudFormation.</text>
