<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 940" width="1440" height="940" font-family="Geist, Inter, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#55555c"/>
    </marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b4a7ff"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6ee7a0"/>
    </marker>
    <style>
      .t  { fill:#f5f5f4; font-size:19px; font-weight:600; }
      .s  { fill:#a1a1aa; font-size:15px; }
      .m  { fill:#a1a1aa; font-size:13.5px; font-family:"Geist Mono", ui-monospace, monospace; }
      .k  { fill:#55555c; font-size:13px; letter-spacing:.16em; font-weight:600; }
      .lil{ fill:#b4a7ff; } .grn{ fill:#6ee7a0; } .amb{ fill:#f5b942; } .red{ fill:#ff6b6b; }
      .box{ fill:#141417; stroke:#26262b; }
      .plane { fill:#0e0e11; stroke:#1c1c21; }
    </style>
  </defs>

  <rect width="1440" height="940" fill="#0b0b0d"/>
  <text x="56" y="56" class="t" font-size="26">Beacon Night Shift — the voice path</text>
  <text x="56" y="82" class="s">Nine tools on one socket. The model decides whether to call one; code decides whether the call is allowed.</text>

  <!-- PLANE 1 -->
  <rect x="40" y="110" width="1360" height="196" rx="20" class="plane"/>
  <text x="62" y="140" class="k">1 · WHERE THE ENGINEER IS, AT 03:12</text>

  <rect x="62" y="158" width="400" height="128" rx="14" class="box"/>
  <text x="84" y="188" class="t">Browser · full duplex</text>
  <text x="84" y="212" class="s">continuous mic, barge-in, no push-to-talk</text>
  <text x="84" y="238" class="m lil">wss://agents.assemblyai.com/v1/ws</text>
  <text x="84" y="262" class="m">Universal-3 Pro · turn detection · TTS</text>

  <rect x="486" y="158" width="380" height="128" rx="14" class="box"/>
  <text x="508" y="188" class="t">Telegram · voice note</text>
  <text x="508" y="212" class="s">the page lands with Talk · Fix 1 · Ack</text>
  <text x="508" y="238" class="m lil">POST /v2/transcript</text>
  <text x="508" y="262" class="m">word confidence → 85 % consent gate</text>

  <rect x="890" y="158" width="488" height="128" rx="14" class="box"/>
  <text x="912" y="188" class="t">What is spoken</text>
  <text x="912" y="214" class="m">“fix it”  ·  “isko fix kar do”</text>
  <text x="912" y="240" class="m amb">“approve fix one”  — the exact phrase</text>
  <text x="912" y="266" class="m">“grant contract for seven days”  ·  “open the pull request”</text>

  <!-- PLANE 2 -->
  <rect x="40" y="340" width="1360" height="248" rx="20" class="plane"/>
  <text x="62" y="370" class="k">2 · CONSENT — DECIDED IN CODE, NOT BY THE MODEL</text>

  <rect x="62" y="388" width="470" height="176" rx="14" class="box" stroke="#b4a7ff"/>
  <text x="84" y="418" class="t">voice Lambda · <tspan class="m lil" font-size="15">POST /tools/&lt;name&gt;</tspan></text>
  <text x="84" y="446" class="s">every tool.call from the socket runs here</text>
  <text x="84" y="474" class="m">TurnContext(transcript, confidence, session)</text>
  <text x="84" y="500" class="s">the model's argument is <tspan class="red">ignored</tspan>; the words are checked</text>
  <text x="84" y="528" class="m" font-size="12.5">get_incident_brief · get_evidence · propose_fix · cancel_proposal</text>
  <text x="84" y="550" class="m" font-size="12.5">approve_fix · undo_fix · grant_sleep_contract · open_fix_pr · check_recovery</text>

  <rect x="556" y="388" width="392" height="176" rx="14" class="box"/>
  <text x="578" y="418" class="t">The four gates</text>
  <text x="578" y="446" class="s">1 · the phrase is in the transcript</text>
  <text x="578" y="472" class="s">2 · the proposal exists and passed its dry run</text>
  <text x="578" y="498" class="s">3 · the action is one of three allowlisted</text>
  <text x="578" y="524" class="s">4 · APPLY_ENABLED, and the passcode</text>
  <text x="578" y="552" class="m grn">barge-in → cancel_proposal → phrase refused</text>

  <rect x="972" y="388" width="406" height="176" rx="14" class="box"/>
  <text x="994" y="418" class="t">The record</text>
  <text x="994" y="446" class="s">approval row: quote, channel, time,</text>
  <text x="994" y="472" class="s">STT confidence, AssemblyAI session id</text>
  <text x="994" y="500" class="m lil">GET /recordings/&lt;session&gt;</text>
  <text x="994" y="526" class="s">the audit plays the words back</text>
  <text x="994" y="552" class="m">DynamoDB · approvals · contracts</text>

  <!-- PLANE 3 -->
  <rect x="40" y="622" width="1360" height="272" rx="20" class="plane"/>
  <text x="62" y="652" class="k">3 · WHAT MAY CHANGE PRODUCTION</text>

  <rect x="62" y="670" width="300" height="118" rx="14" class="box"/>
  <text x="84" y="700" class="t">Evidence first</text>
  <text x="84" y="726" class="s">golden snapshot drift</text>
  <text x="84" y="750" class="s">CloudTrail change ledger</text>
  <text x="84" y="774" class="m">exact ids — no guessing</text>

  <rect x="392" y="670" width="268" height="118" rx="14" class="box"/>
  <text x="414" y="700" class="t">Dry run</text>
  <text x="414" y="726" class="s">under the remediator role</text>
  <text x="414" y="750" class="m amb">DryRunOperation</text>
  <text x="414" y="774" class="s">blast radius, read aloud</text>

  <rect x="690" y="670" width="360" height="118" rx="14" class="box" stroke="#6ee7a0"/>
  <text x="712" y="700" class="t">Step Functions · verify loop</text>
  <text x="712" y="726" class="s">execute once → wait → verify ×6</text>
  <text x="712" y="750" class="m grn" font-size="12.5">alarm OK after the fix ∧ metric 0 ∧ rule present</text>
  <text x="712" y="774" class="s">otherwise: escalate, honestly</text>

  <rect x="1080" y="670" width="298" height="118" rx="14" class="box"/>
  <text x="1102" y="700" class="t">Three actions. That is all.</text>
  <text x="1102" y="726" class="m">sg.restore_ingress</text>
  <text x="1102" y="748" class="m">sg.revoke_ingress <tspan class="s">(the undo)</tspan></text>
  <text x="1102" y="770" class="m">ecs.force_redeploy</text>

  <rect x="62" y="806" width="620" height="70" rx="14" class="box"/>
  <text x="84" y="836" class="t">Sleep Contract</text>
  <text x="84" y="860" class="s">scoped, counted, expiring — the second night, nobody is woken</text>

  <rect x="712" y="806" width="666" height="70" rx="14" class="box" stroke="#b4a7ff"/>
  <text x="734" y="836" class="t">open_fix_pr → GitHub</text>
  <text x="734" y="860" class="s">the rule restored in the template + the postmortem. Beacon never merges.</text>

  <!-- flows -->
  <path d="M262 286 L262 388" stroke="#b4a7ff" stroke-width="2" fill="none" marker-end="url(#al)"/>
  <text x="274" y="342" class="m lil">tool.call</text>
  <path d="M676 286 L400 388" stroke="#55555c" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M297 564 L297 670" stroke="#55555c" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="309" y="622" class="m">only after the gates</text>
  <path d="M362 729 L392 729" stroke="#55555c" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M660 729 L690 729" stroke="#55555c" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M1050 729 L1080 729" stroke="#6ee7a0" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>
  <path d="M1175 564 L1175 670" stroke="#55555c" stroke-width="1.6" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text x="1187" y="622" class="m">every outcome recorded</text>
</svg>
